# Keeps the Supabase free-tier project from pausing after 7 days of inactivity.
# A present (even bogus) Bearer header makes the Edge Function run its members
# SELECT before it rejects the token, so the request is real database activity
# and the 401 below is expected, not a failure.
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if the repo goes quiet.
name: keep-warm

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the memory endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer keep-warm' \
            'https://vfjgwyiqlesbuudhulcf.supabase.co/functions/v1/mcp')
          echo "HTTP $code (401 expected)"
